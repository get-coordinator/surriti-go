name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Check tidy module graph
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...

  surrealdb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SURRITI_INTEGRATION: "1"
      SURRITI_SURREAL_URL: ws://127.0.0.1:8000/rpc
      SURRITI_SURREAL_NS: surriti_go
      SURRITI_SURREAL_USER: root
      SURRITI_SURREAL_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Start SurrealDB 3.0.5
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:v3.0.5 \
            start --user root --pass root memory
          for i in $(seq 1 30); do
            if docker exec surrealdb /surreal is-ready --endpoint http://127.0.0.1:8000; then
              exit 0
            fi
            sleep 1
          done
          docker logs surrealdb
          exit 1
      - name: Live integration tests
        run: go test -race -count=1 -run '^TestIntegration' ./...
      - name: Dump SurrealDB logs on failure
        if: failure()
        run: docker logs surrealdb
